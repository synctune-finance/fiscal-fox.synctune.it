name: Deploy static site

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "manual/**"
      - "self-hosting/**"
      - "assets/**"
      - "scripts/**"
      - "CNAME"
      - ".nojekyll"
      - "robots.txt"
      - "sitemap.xml"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "*.html"
      - "manual/**"
      - "self-hosting/**"
      - "assets/**"
      - "scripts/**"
      - "CNAME"
      - ".nojekyll"
      - "robots.txt"
      - "sitemap.xml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'production' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: Check and package static site
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Check shared page layout
        run: node scripts/layout.mjs --check

      - name: Check links, assets and accessibility
        run: node scripts/check-site.mjs --external

      - name: Prepare public files
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          cp -- *.html robots.txt sitemap.xml CNAME .nojekyll "$RUNNER_TEMP/pages/"
          cp -R -- assets manual self-hosting "$RUNNER_TEMP/pages/"

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages
          retention-days: 1
          include-hidden-files: true

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
